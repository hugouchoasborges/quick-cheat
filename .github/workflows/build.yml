name: Windows build
on:
  push:
    branches: [develop, 'feature/**', 'release/**', 'hotfix/**', main]
  pull_request:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: QuickCheat-windows-x64
          path: |
            build/Release/QuickCheat.exe
            LICENSE
            README.md
